name: Validate Investor Flow Reversal

on:
  push:
    branches: [feature/investor-flow-reversal-screener, main]
    paths:
      - flow_reversal.py
      - access_gate.py
      - app.py
      - report.py
      - .streamlit/config.toml
      - full_flow_scan.py
      - flow_scan_delivery.py
      - krx_auth.py
      - scripts/run_flow_scan.py
      - pages/**
      - tests/test_flow_reversal.py
      - tests/test_full_flow_scan.py
      - tests/test_krx_retry_diagnostics.py
      - tests/test_access_gate.py
      - tests/test_theme.py
      - tests/test_flow_scan_delivery.py
      - tests/test_krx_auth.py
      - tests/test_candidate_screener_ui.py
      - .github/workflows/flow-reversal-check.yml
  pull_request:
    paths:
      - flow_reversal.py
      - access_gate.py
      - app.py
      - report.py
      - .streamlit/config.toml
      - full_flow_scan.py
      - flow_scan_delivery.py
      - krx_auth.py
      - scripts/run_flow_scan.py
      - pages/**
      - tests/test_flow_reversal.py
      - tests/test_full_flow_scan.py
      - tests/test_krx_retry_diagnostics.py
      - tests/test_access_gate.py
      - tests/test_theme.py
      - tests/test_flow_scan_delivery.py
      - tests/test_krx_auth.py
      - tests/test_candidate_screener_ui.py
      - .github/workflows/flow-reversal-check.yml

jobs:
  reversal-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas requests beautifulsoup4 pillow pytest
      - name: Compile new modules
        run: python -m compileall -q app.py report.py access_gate.py flow_reversal.py full_flow_scan.py flow_scan_delivery.py krx_auth.py pages scripts tests
      - name: Test market-wide and candidate reversal scanner
        run: python -m pytest -q tests/test_flow_reversal.py tests/test_full_flow_scan.py tests/test_krx_retry_diagnostics.py tests/test_flow_scan_delivery.py tests/test_krx_auth.py tests/test_access_gate.py tests/test_theme.py tests/test_candidate_screener_ui.py
