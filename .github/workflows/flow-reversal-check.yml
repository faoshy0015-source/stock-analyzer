name: Validate Investor Flow Reversal

on:
  push:
    branches: [feature/investor-flow-reversal-screener]
  pull_request:
    paths:
      - flow_reversal.py
      - pages/1_수급_전환_검색.py
      - tests/test_flow_reversal.py
      - .github/workflows/flow-reversal-check.yml

jobs:
  reversal-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas pytest
      - name: Compile new modules
        run: python -m compileall -q flow_reversal.py pages tests/test_flow_reversal.py
      - name: Test reversal screening
        run: python -m pytest -q tests/test_flow_reversal.py
