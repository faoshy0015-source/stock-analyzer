name: Validate Investor Flow Reversal

on:
  push:
    branches: [feature/investor-flow-reversal-screener, main]
    paths:
      - flow_reversal.py
      - full_flow_scan.py
      - flow_scan_delivery.py
      - scripts/run_flow_scan.py
      - pages/**
      - tests/test_flow_reversal.py
      - tests/test_full_flow_scan.py
      - tests/test_flow_scan_delivery.py
      - .github/workflows/flow-reversal-check.yml
  pull_request:
    paths:
      - flow_reversal.py
      - full_flow_scan.py
      - flow_scan_delivery.py
      - scripts/run_flow_scan.py
      - pages/**
      - tests/test_flow_reversal.py
      - tests/test_full_flow_scan.py
      - tests/test_flow_scan_delivery.py
      - .github/workflows/flow-reversal-check.yml

jobs:
  reversal-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pandas requests pytest
      - name: Compile new modules
        run: python -m compileall -q flow_reversal.py full_flow_scan.py flow_scan_delivery.py pages scripts tests/test_flow_reversal.py tests/test_full_flow_scan.py
      - name: Test market-wide and candidate reversal scanner
        run: python -m pytest -q tests/test_flow_reversal.py tests/test_full_flow_scan.py tests/test_flow_scan_delivery.py
